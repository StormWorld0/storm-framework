name: Multi-OS CI Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  script-test:
    name: Test ${{ matrix.setup_type }} on ${{ matrix.os }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu:latest, debian:latest, kalilinux/kali-rolling:latest]
        setup_type: [linux, venv, docker]

    container:
      image: ${{ matrix.os }}
      # Tetap privileged untuk akses Dind (Docker in Docker) socket
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    steps:          
      - name: Prepare Root Environment & Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          rm -rf /var/lib/apt/lists/*
          apt-get clean
          
          if [ "${{ matrix.os }}" = "kalilinux/kali-rolling:latest" ]; then
            rm -f /etc/apt/sources.list.d/kali.sources
            echo "deb http://http.kali.org/kali kali-rolling main contrib non-free non-free-firmware" > /etc/apt/sources.list
            
            apt-get update -y
            
            cat << 'EOF' > /usr/local/bin/apt-get
          #!/bin/bash
          rm -f /etc/apt/sources.list.d/kali.sources
          echo "deb http://http.kali.org/kali kali-rolling main contrib non-free non-free-firmware" > /etc/apt/sources.list
          
          if [[ "$*" == *"install"* ]]; then
              /usr/bin/apt-get update -y >/dev/null 2>&1
          fi
          
          exec /usr/bin/apt-get "$@" --fix-missing --no-install-recommends
          EOF
            
            cp /usr/local/bin/apt-get /usr/local/bin/apt
            chmod +x /usr/local/bin/apt-get /usr/local/bin/apt
          else
            apt-get update -y
          fi
          
          if [ "${{ matrix.setup_type }}" = "docker" ]; then
            apt-get install -y curl sudo bash jq docker.io
          else
            apt-get install -y curl sudo bash jq
          fi

      - name: Configure Unprivileged Test User (Privilege Drop)
        run: |
          # Buat standard user 'stormdev' untuk memvalidasi user-space script
          useradd -m -s /bin/bash stormdev
          
          # Berikan akses sudo tanpa password (simulasi environment user lokal)
          usermod -aG sudo stormdev
          echo "stormdev ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          
          # Dynamic Docker GID Mapping
          # Jika setup docker, user butuh akses ke /var/run/docker.sock dari host
          if [ "${{ matrix.setup_type }}" = "docker" ]; then
            DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
            groupadd -g $DOCKER_GID docker_host || true
            usermod -aG docker_host stormdev
          fi

      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Fix Workspace Permissions
        run: |
          # Git checkout dilakukan oleh root, kita harus serahkan ownership ke test user
          # Mencegah error "fatal: detected dubious ownership in repository"
          chown -R stormdev:stormdev $GITHUB_WORKSPACE

      - name: Execute Storm Installation (${{ matrix.setup_type }})
        shell: bash
        run: |
          # Eksekusi skrip menggunakan 'su' untuk transisi dari root ke user biasa.
          # Logika if/elif diganti dengan string interpolation yang lebih efisien (DRY).
          su - stormdev -c "cd $GITHUB_WORKSPACE && bash ./setup${{ matrix.setup_type }}"
          
